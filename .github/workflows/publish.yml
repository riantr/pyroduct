# Publish riantr/pyroduct to mooncakes.io, on a v* tag.
#
# Modelled on riantr/moonbit_static_analysis's publish.yml, which is the sibling
# repo whose publish path actually works. The facts that matter and are easy to
# get wrong:
#
#   * Authentication is NOT an environment variable. `moon publish` reads
#     $HOME/.moon/credentials.json, so the secret is written there, used, and
#     removed by a trap on the way out — including on failure.
#   * `moon publish` exits 255 both when it cannot authenticate and when the
#     registry rejects it, so the secret is checked for emptiness first;
#     otherwise the two are indistinguishable in the log.
#   * The secret's VALUE is the whole contents of ~/.moon/credentials.json, not
#     the bare token. That file is a JSON object:
#         { "token": "<...>", "username": "riantr" }
#     so pasting only the token writes an invalid credentials.json and
#     `moon publish` then fails with the same opaque 255 as a real rejection.
#     Copy the file (it lands there after `moon login`), not one field of it.
#   * `moon publish` takes the version from moon.mod, NOT from the tag. If they
#     disagree the module is published under a version the tag does not name,
#     and the tag then points at a release that does not exist. Asserted below.
#
# TO ENABLE: set the secret under
#     Settings -> Secrets and variables -> Actions
# as MOONCAKES_RIANTR_TOKEN. The publish step fails fast and loudly when it is
# absent, by design — a silent skip would look like a successful release, and
# this module is currently N releases behind on the registry.
#
# To cut a release:
#   1. set version in moon.mod
#   2. sync every version reference (README.mbt.md, README.zh.mbt.md, AGENTS.md,
#      plugin/skills/, .dsh/skills/, plugin/vendor/BUILD.json via update-bundle)
#   3. commit, push to gitee (daily remote) AND to github
#   4. git tag -a v<version> -m "..." && git push github v<version>
#
# Step 4 is what triggers this. A tag pushed to gitee alone does nothing — and
# gitee is where daily commits go, so the two remotes must both be pushed.
#
# Why this does not wait on gate.yml: `needs:` cannot cross workflow files, and
# workflow_run would couple this to another workflow's payload shape. Re-running
# the checks inline is one file and cannot drift out of sync with the tag.
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_COLOR: 1
      SECRET: ${{ secrets.MOONCAKES_RIANTR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install moon
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moon/bin:$PATH"
          command -v moon >/dev/null || {
            echo "::error::moon is still not on PATH after the install script"
            exit 1
          }
          moon version --all

      - name: Resolve the registry index
        run: moon update

      - name: moon.mod must agree with the tag
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          got=$(sed -n 's/^version = "\(.*\)"$/\1/p' moon.mod)
          if [ "$got" != "$want" ]; then
            echo "::error file=moon.mod::version is '$got', tag says '$want'."
            exit 1
          fi
          echo "ok  moon.mod  version=$got"

      - name: There must be exactly one module
        # The shape is asserted rather than hard-coded, so a layout change has to
        # change this workflow on purpose instead of quietly publishing a
        # different set of packages.
        run: |
          set -euo pipefail
          n=$(find . -name moon.mod -not -path "./_build/*" \
                -not -path "./.mooncakes/*" | wc -l)
          if [ "$n" -ne 1 ]; then
            echo "::error::found $n moon.mod files; this workflow publishes the"
            echo "single root module. If the layout changed, update this workflow"
            echo "on purpose rather than letting it publish the wrong set."
            exit 1
          fi
          echo "ok  exactly one module at the repository root"

      - name: Gate
        # The wasm commands plus BOTH native test packages. `moon build --target
        # js` matters here: the plugin pins that bundle by sha256, so a bridge
        # that builds but no longer matches the pin is a release hazard.
        #
        # The three native entrypoints (cmd/ifacescan, cmd/coord,
        # examples/sediment) are deliberately NOT repeated here — gate.yml runs
        # them on the same push that carried the tag, and this workflow must
        # re-check the tag's own tree without turning a release into a second
        # full gate. What gate.yml cannot cross-reference is stated there.
        run: |
          moon fmt --check
          moon check --deny-warn
          moon test --deny-warn
          moon test --target native snnref
          moon test --target native tools/ifacescan
          moon build --target js
          moon build --target wasm

      - name: Publish to Mooncakes
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::MOONCAKES_RIANTR_TOKEN is not set on this repository."
            echo "moon publish cannot authenticate. Nothing was published."
            exit 1
          fi
          mkdir -p "$HOME/.moon"
          printf '%s' "$SECRET" > "$HOME/.moon/credentials.json"
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          moon publish

      - name: Create GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "pyroduct ${GITHUB_REF_NAME#v}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}