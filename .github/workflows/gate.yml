# CI gate for riantr/pyroduct.
#
# Modelled on riantr/moonbit_static_analysis's gate.yml, which is the sibling
# repo whose workflow actually runs green. Three things in it are load-bearing
# and were learned the hard way there; they are reproduced here rather than
# reinvented:
#
#   1. Install from the official script, NOT a setup action. The action this
#      used to reference (moonbitlang/setup-moonbit) is 404, and the near-miss
#      moonbit-community/setup-moonbit has zero tags, so any @vN ref fails too.
#      A workflow's `uses:` refs are resolved during job SETUP, before any step
#      is named in the log — which is why a typo there produced 30/30 runs
#      failing at "Set up job" and never once reached a step.
#   2. The path is install/unix.sh, not install.sh: the latter answers 403 even
#      from a GitHub runner (the first fixed run died with curl exit 22).
#   3. `moon update` is mandatory. A fresh runner's registry index is empty and
#      this module imports four packages from mooncakes.io, so every build
#      command below would fail with "Failed to resolve registry dependency".
#      A warm local index hides this completely.
#
# What is different from the sibling's gate: this module has five `+native`
# packages that the wasm target SKIPS (cmd/coord, cmd/ifacescan, snnref,
# examples/sediment, tools/ifacescan). A gate that only ran the wasm target
# would silently never execute them — the same failure shape as "0 findings"
# meaning "cannot see". They are gated explicitly below.
name: gate

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install moon
        # The trailing version check is not decoration: without it a silently
        # failed install surfaces three steps later as a confusing
        # "moon: command not found" inside `moon check`.
        #
        # MOON_VERSION is the toolchain this tree was measured on. The install
        # CANNOT name a version: every versioned path under
        # cli.moonbitlang.com/binaries/<version>/ answers 403 (measured
        # 2026-10-24 for 0.1.20261016 and 0.1.20261023, with and without the
        # build hash), while `binaries/latest` and `cores/core-latest` answer
        # 206. So the script always installs whatever is newest, and the tree
        # would be measured on a moving toolchain -- which is exactly how
        # 0.1.20261012's `Int` -> `Int32` rewrite turned a green run into a
        # red one with no edit of our own.
        #
        # What the install can do is SAY which version this release was measured
        # on, and fail when the runner disagrees. A toolchain that moved under
        # the release then turns the gate red with a message naming both
        # versions, instead of silently changing what "the gate passed" means.
        # The local toolchain on the day of this measurement was
        # moon 0.1.20261023 (build 3778465) with moonc v0.10.17+d971670cd.
        env:
          MOON_VERSION: "0.1.20261023"
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moon/bin:$PATH"
          command -v moon >/dev/null || {
            echo "::error::moon is still not on PATH after the install script"
            exit 1
          }
          moon version --all
          got="$(moon version --all | sed -n 's/^moon \([^ ]*\) .*/\1/p')"
          if [ "$got" != "$MOON_VERSION" ]; then
            echo "::error::this tree was measured on moon $MOON_VERSION; the runner has $got"
            echo "::error::re-measure on $got and bump MOON_VERSION in this workflow, or install $MOON_VERSION by hand"
            exit 1
          fi
          echo "ok  toolchain  moon=$got"

      - name: Resolve the registry index
        run: moon update

      # The pins in moon.mod are a promise about what this gate builds, and
      # nothing else in the build checks that the promise was kept. `moon
      # update` only refreshes the registry index -- it does not change a pin
      # and does not change what resolves. `moon upgrade` is not a dependency
      # command at all: it upgrades the TOOLCHAIN (the MoonBit compiler), so
      # putting it here would move the compiler under the gate rather than
      # check the dependencies.
      #
      # This asserts the RESOLVED tree against the pins: every pin in moon.mod
      # must resolve to exactly the version moon.mod names, and the root
      # module to the version it declares. Transitive dependencies are listed
      # but not asserted -- we do not pin them, so they are not ours to claim.
      # It runs before the build and test steps so a resolution problem is
      # reported as itself rather than as a mysterious failure later.
      - name: The resolved dependency tree must match the pins
        run: python tools/validate_resolved_deps.py

      # The pins are also stated, in prose, all over the repository: 53
      # `package@version` literals across the READMEs, AGENTS.md, the
      # architecture files, the package doc comments, the rendered face text,
      # the plugin's face catalog and both skill copies. Every one of those is
      # a second copy of the pin, and nothing bound them to it -- so bumping a
      # pin (which the release policy does on every release) left the
      # repository still saying the old version, with a green gate.
      #
      # This asserts each of those literals against the pin it copies. For a
      # transitive dependency (riantr/moonbit_image, pulled in by
      # riantr/snn_mbt) the literal is asserted against the RESOLVED tree
      # instead, since we do not pin it ourselves.
      - name: Every dependency version literal must match the pin it copies
        run: python tools/validate_pin_copies.py

      # --deny-warn per the official package-configuration guidance: without it
      # this gate passes on a warning regression while the docs claim zero.
      - name: moon check
        run: moon check --deny-warn

      - name: moon fmt --check
        run: moon fmt --check

      - name: moon test (wasm)
        run: moon test --deny-warn

      # Both targets the published artifacts are built from. `--target js` is
      # the agent bridge (cmd/jsoncli -> _build/js/.../jsoncli.js), which the
      # plugin pins by sha256; `--target wasm` is what the registry compiles
      # server-side into the artifact skills.mooncakes.io links and moonx
      # downloads. A regression visible only on either one would otherwise ship.
      - name: The bridge target (js) must build
        run: moon build --target js

      - name: The wasm target must build
        run: moon build --target wasm

      # ---- the native packages the wasm target skips ----
      #
      # Deliberately NOT run: `moon check --target native`. It is red today, and
      # for a reason that is not a defect — tools/ifacescan/moon.pkg imports
      # moonbitlang/async purely so its test file can hold `async test`, and
      # moon's unused-package scan does not see test files, so that one package
      # reports an unused import under --deny-warn. The default wasm-target
      # `moon check` above never sees it, because the package is +native. Adding
      # the native check here would turn the gate red over a retained,
      # documented import rather than over any real regression. The tests below
      # are what actually hold this package down.
      #
      # There are exactly five +native packages, and this block must keep naming
      # all five: one that nobody runs here is one whose only execution is
      # somebody's terminal — the same failure shape as a gate that reports zero
      # findings because it cannot see.
      #   assertions : snnref, tools/ifacescan   (run with `moon test --target native`)
      #   entrypoints: cmd/ifacescan, cmd/coord, examples/sediment (run directly)
      #
      # Listed by package rather than by a blanket "moon test --target native",
      # which would also try to build the executable packages as test targets.

      - name: native · snnref (spike-sediment experiment)
        run: moon test --target native snnref

      - name: native · tools/ifacescan (.mbti drift tripwire)
        # The drift tripwire is the whole point of the embedded .mbti snapshot:
        # if `moon info` regenerated an interface file and the snapshot was not
        # refreshed, this goes red rather than the mbti face quietly reporting
        # stale numbers.
        run: moon test --target native tools/ifacescan

      - name: native · cmd/ifacescan (scan every tracked .mbti)
        # Exit code is 0 regardless of findings today, so this asserts it runs,
        # not that it is clean — the assertions above are the teeth.
        run: moon run --target native cmd/ifacescan

      - name: native · cmd/coord (checkpoint must round-trip)
        # Writes .openseek/coordinator-state.txt (gitignored); a non-zero exit
        # here means the checkpoint did not survive serialize -> deserialize.
        # The step used to be unable to fail at all -- it printed the verdict
        # and always exited 0, while this comment claimed otherwise -- so the
        # runtime now aborts when the round-trip breaks.
        run: moon run --target native cmd/coord

      - name: native · examples/sediment (the snnref experiment, end to end)
        # The example is snnref's shipped entrypoint and is deterministic (fixed
        # seed), so it is a legitimate gate: it asserts the experiment still
        # recovers the 8-slot structure rather than merely exiting 0.
        run: moon run --target native examples/sediment

      # ---- architecture drift detectors ----
      #
      # Two drift failures happened before any standing check caught them:
      # (1) module-dependencies.dot drew cmd_jsoncli -> viz, but cmd/jsoncli
      #     does not import viz — a false edge that no test exercised;
      # (2) plugin/server.mjs said "190 tests" while the actual count was 197 —
      #     the same drift shape as the "28 faces" bug commit 7b95863 fixed.
      # Both are now caught here so they cannot recur.

      - name: architecture · dependency edges + version pins must match code
        # Parses every moon.pkg import block, compares against the two DOT
        # diagrams in architecture/. Reports false edges (in diagram, not in
        # code) and missing edges (in code, not in diagram). Examples and
        # tools/ are excluded — they are intentionally absent from the diagrams.
        # Also checks that all DOT files carry a // model-version: X.Y.Z header
        # matching the current moon.mod version.
        run: python tools/validate_dependencies.py

      - name: architecture · README model facts must match code
        # Parses README.mbt.md and README.zh.mbt.md for numerical claims about
        # states, transitions, phases, triggers, and slots, then compares them
        # against the ground truth extracted from source code. Catches drift
        # when model enums change but documentation doesn't.
        run: python tools/validate_readme_facts.py

      - name: architecture · the CLI's face list must match the bridge's
        # Three copies of the same names live in two files: the bridge's
        # faces() (returned in every reply, read by both plugins), the CLI's
        # match arms, and the CLI's usage header. Nothing compared them, so a
        # face added to one and forgotten in another was invisible until
        # someone typed the missing spelling. This asserts all three agree,
        # and that the count the CLI's own error message publishes is real.
        run: python tools/validate_cli_faces.py

      - name: plugin · anti-drift (faces, versions, test count, model facts, invariants)
        # The harness prints its own check count; do not transcribe it here.
        # What it covers: pin SHA-256, MCP handshake, all 31 faces render, face-count
        # anti-drift, page-citation anti-drift, test-count anti-drift (the gates
        # description must state the real wasm test count), model fact anti-drift
        # (face descriptions must match actual state/transition/phase counts),
        # version consistency (plugin.json = server.mjs SERVER_VERSION), and
        # content invariants.
        #
        # The logic lives in tools/ci_plugin_gate.sh, shared with publish.yml,
        # because every exit path here has to be able to report what died. Four
        # consecutive red runs of this release were diagnosed by elimination:
        # the run log needs credentials, so it was unreadable. That script also
        # writes the diagnosis into the job summary, which IS readable without
        # credentials (check-runs -> output.summary).
        run: bash tools/ci_plugin_gate.sh