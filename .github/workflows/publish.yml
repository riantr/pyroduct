# Publish riantr/pyroduct to mooncakes.io, on a v* tag.
#
# Modelled on riantr/moonbit_static_analysis's publish.yml, which is the sibling
# repo whose publish path actually works. The facts that matter and are easy to
# get wrong:
#
#   * Authentication is NOT an environment variable. `moon publish` reads
#     $HOME/.moon/credentials.json, so the secret is written there, used, and
#     removed by a trap on the way out — including on failure.
#   * The secret's VALUE is the whole contents of ~/.moon/credentials.json, not
#     the bare token. That file is a JSON object:
#         { "token": "<...>", "username": "riantr" }
#     Copy the file (it lands there after `moon login`), not one field of it.
#   * Every failure mode was MEASURED (moon 0.1.20260920), by re-running each one
#     against a deliberately bogus token in a throwaway HOME:
#         malformed credentials file -> `failed to parse credentials file: <path>:
#             expected value at line 1 column 1`   (local, names the file)
#         invalid token              -> `Server status: 401 Unauthorized,
#             detail: Invalid API token`
#         token accepted, dry run    -> `202 Accepted, detail: Dry run completed
#             successfully`
#         token accepted, real       -> `200 OK`
#     The EXIT CODE is -1 (255) in all four cases including the successes, so it
#     proves nothing; assert on the status line instead (the publish step does).
#     The reason the secret is still pre-checked for emptiness is ergonomics, not
#     diagnosability: an unset secret would otherwise produce a parse error that
#     never mentions that a secret is missing.
#   * `moon publish` takes the version from moon.mod, NOT from the tag. If they
#     disagree the module is published under a version the tag does not name,
#     and the tag then points at a release that does not exist. Asserted below.
#
# TO ENABLE: set the secret under
#     Settings -> Secrets and variables -> Actions
# as MOONCAKES_RIANTR_TOKEN. The publish step fails fast and loudly when it is
# absent, by design — a silent skip would look like a successful release.
#
# To VERIFY the secret before cutting any release: Actions -> publish -> Run
# workflow, leaving `dry run` at its default. That runs the whole gate for real,
# writes the secret, and has the registry accept-or-reject the token — then stops.
# It publishes nothing and creates no GitHub Release.
#
# To cut a release:
#   1. set version in moon.mod
#   2. sync every version reference (README.mbt.md, README.zh.mbt.md, AGENTS.md,
#      plugin/skills/, .dsh/skills/, plugin/vendor/BUILD.json via update-bundle)
#   3. commit, push to gitee (daily remote) AND to github
#   4. git tag -a v<version> -m "..." && git push github v<version>
#
# Step 4 is what triggers this. A tag pushed to gitee alone does nothing — and
# gitee is where daily commits go, so the two remotes must both be pushed.
#
# Why this does not wait on gate.yml: `needs:` cannot cross workflow files, and
# workflow_run would couple this to another workflow's payload shape. Re-running
# the checks inline is one file and cannot drift out of sync with the tag.
name: publish

on:
  push:
    tags:
      - "v*"
  # Manual runs exist so the secret can be verified without cutting a tag and
  # without publishing anything: `moon publish --dry-run` really contacts the
  # registry and really rejects a bad token with 401 (measured — see the header),
  # so a dry run is a genuine end-to-end rehearsal that stops short of a release.
  # Default is dry run, because the safe thing should be what a stray click does.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry run: exercise everything and validate the token, publish nothing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_COLOR: 1
      SECRET: ${{ secrets.MOONCAKES_RIANTR_TOKEN }}
      # Empty on a tag push, so `!= true` there — a real release always publishes.
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install moon
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moon/bin:$PATH"
          command -v moon >/dev/null || {
            echo "::error::moon is still not on PATH after the install script"
            exit 1
          }
          moon version --all

      - name: Resolve the registry index
        run: moon update

      - name: moon.mod must agree with the tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "::notice::manual run on '${GITHUB_REF_NAME}', not a tag."
            echo "The tag/version assertion only means something on a real release,"
            echo "so it is skipped here; everything else below still runs for real."
            exit 0
          fi
          want="${GITHUB_REF_NAME#v}"
          got=$(sed -n 's/^version = "\(.*\)"$/\1/p' moon.mod)
          if [ "$got" != "$want" ]; then
            echo "::error file=moon.mod::version is '$got', tag says '$want'."
            exit 1
          fi
          echo "ok  moon.mod  version=$got"

      - name: There must be exactly one module
        # The shape is asserted rather than hard-coded, so a layout change has to
        # change this workflow on purpose instead of quietly publishing a
        # different set of packages.
        run: |
          set -euo pipefail
          n=$(find . -name moon.mod -not -path "./_build/*" \
                -not -path "./.mooncakes/*" | wc -l)
          if [ "$n" -ne 1 ]; then
            echo "::error::found $n moon.mod files; this workflow publishes the"
            echo "single root module. If the layout changed, update this workflow"
            echo "on purpose rather than letting it publish the wrong set."
            exit 1
          fi
          echo "ok  exactly one module at the repository root"

      - name: Gate
        # The wasm commands plus BOTH native test packages. `moon build --target
        # js` matters here: the plugin pins that bundle by sha256, so a bridge
        # that builds but no longer matches the pin is a release hazard.
        #
        # The three native entrypoints (cmd/ifacescan, cmd/coord,
        # examples/sediment) are deliberately NOT repeated here — gate.yml runs
        # them on the same push that carried the tag, and this workflow must
        # re-check the tag's own tree without turning a release into a second
        # full gate. What gate.yml cannot cross-reference is stated there.
        run: |
          moon fmt --check
          moon check --deny-warn
          moon test --deny-warn
          moon test --target native snnref
          moon test --target native tools/ifacescan
          moon build --target js
          moon build --target wasm

      - name: Publish to Mooncakes
        run: |
          set -euo pipefail
          if [ -z "$SECRET" ]; then
            echo "::error::MOONCAKES_RIANTR_TOKEN is not set on this repository."
            echo "moon publish cannot authenticate. Nothing was published."
            exit 1
          fi
          mkdir -p "$HOME/.moon"
          printf '%s' "$SECRET" > "$HOME/.moon/credentials.json"
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run — the gate above really ran and the token below is"
            echo "really validated against the registry, but nothing is published."
            # Do NOT trust the exit code: a dry run returns -1 even when the server
            # answers 202 Accepted. Assert on the status line, which is the only
            # thing that separates 'the token worked' from '401 Invalid API token'.
            #
            # Matched with a bash pattern, NOT `printf … | grep -qE`. Under
            # `set -o pipefail` a `grep -q` exits on its first match and SIGPIPEs the
            # writer, which makes the whole pipeline non-zero — so a genuine match
            # gets reported as a failure once the output outgrows the pipe buffer.
            # Reproduced at ~1 MB; the warm-cache case is only ~820 bytes and hides it.
            out=$(moon publish --dry-run 2>&1) || true
            printf '%s\n' "$out"
            echo "::notice::moon produced ${#out} bytes (included above in full)"
            case "$out" in
              *"Server status: 200"*|*"Server status: 202"*)
                echo "ok  the registry accepted this token; nothing was published" ;;
              *)
                echo "::error::the dry run did not reach an accepted status, and the output"
                echo "is above in full. Read it as: 'Server status: 401' means the secret's"
                echo "token is wrong or unset; 'failed to parse credentials file' means the"
                echo "secret is not the whole ~/.moon/credentials.json."
                exit 1 ;;
            esac
            exit 0
          fi
          moon publish

      - name: Create GitHub Release
        # Tag pushes only: a manual dry run has no tag to release, and creating
        # one from a run that published nothing would put a hollow release on the
        # repository.
        if: github.ref_type == 'tag'
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "pyroduct ${GITHUB_REF_NAME#v}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}